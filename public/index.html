<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinguaEdu · 多语种沉浸式学习平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .glass { backdrop-filter: blur(12px); background: rgba(255,255,255,0.7); }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .card-hover { transition: all 0.3s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
    .speaking-wave { animation: wave 1s infinite; }
    @keyframes wave { 0%,100% { transform: scaleY(0.3);} 50% { transform: scaleY(1);} }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 min-h-screen">
  <div id="app"></div>

  <script>
    const state = {
      user: JSON.parse(localStorage.getItem('lingua_user') || 'null'),
      token: localStorage.getItem('lingua_token') || '',
      currentPage: 'home',
      currentCourse: null,
      currentLesson: null
    };

    const _store = { courses: {}, lessons: {} };
    const storeObj = (prefix, obj) => {
      const id = prefix + '_' + Math.random().toString(36).slice(2, 9);
      if (prefix === 'course') _store.courses[id] = obj;
      else _store.lessons[id] = obj;
      return id;
    };
    const getStored = (prefix, id) => prefix === 'course' ? _store.courses[id] : _store.lessons[id];

    const $ = (id) => document.getElementById(id);
    const api = {
      async get(path) {
        const headers = state.token ? { 'Authorization': 'Bearer ' + state.token } : {};
        const res = await fetch(path, { headers });
        return res.json();
      },
      async post(path, data) {
        const headers = { 'Content-Type': 'application/json' };
        if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
        const res = await fetch(path, { method: 'POST', headers, body: JSON.stringify(data) });
        return res.json();
      },
      async put(path, data) {
        const headers = { 'Content-Type': 'application/json' };
        if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
        const res = await fetch(path, { method: 'PUT', headers, body: JSON.stringify(data) });
        return res.json();
      }
    };

    function saveAuth(data) {
      state.token = data.token;
      state.user = data.user;
      localStorage.setItem('lingua_token', data.token);
      localStorage.setItem('lingua_user', JSON.stringify(data.user));
    }

    function logout() {
      state.token = '';
      state.user = null;
      localStorage.removeItem('lingua_token');
      localStorage.removeItem('lingua_user');
      navigate('home');
      render();
    }

    function navigate(page, params = {}) {
      state.currentPage = page;
      Object.assign(state, params);
      window.scrollTo(0, 0);
      render();
    }

    const pages = {
      home: renderHome,
      login: renderLogin,
      register: renderRegister,
      courses: renderCourses,
      course: renderCourse,
      lesson: renderLesson,
      dashboard: renderDashboard,
      community: renderCommunity,
      achievements: renderAchievements,
      placement: renderPlacement,
      studyplan: renderStudyPlan,
      certificates: renderCertificates,
      report: renderReport,
      scenario: renderScenarioList,
      scenario_practice: renderScenarioPractice,
      reminders: renderReminders,
      unit_test: renderUnitTest,
      live: renderLiveList,
      live_room: renderLiveRoom
    };

    async function render() {
      const app = $('app');
      app.innerHTML = '';
      app.appendChild(renderNavbar());
      const content = document.createElement('div');
      content.className = 'max-w-7xl mx-auto px-4 py-6 fade-in';
      app.appendChild(content);
      try {
        const result = pages[state.currentPage]?.call(content);
        if (result && typeof result.catch === 'function') await result;
      } catch (e) {
        console.error(e);
      }
      app.appendChild(renderFooter());
    }

    function renderNavbar() {
      const nav = document.createElement('nav');
      nav.className = 'glass sticky top-0 z-50 border-b border-slate-200';
      nav.innerHTML = `
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
          <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
            <div class="w-10 h-10 rounded-xl gradient-bg flex items-center justify-center text-white font-bold text-xl">L</div>
            <div>
              <div class="font-bold text-slate-800 text-lg">LinguaEdu</div>
              <div class="text-xs text-slate-500 -mt-1">沉浸式语言学习</div>
            </div>
          </div>
          <div class="hidden md:flex items-center gap-1">
            ${navLink('首页', 'home')}
            ${navLink('课程中心', 'courses')}
            ${state.user ? navLink('学习中心', 'dashboard') : ''}
            ${state.user ? navLink('直播', 'live') : ''}
            ${state.user ? navLink('成就', 'achievements') : ''}
            ${state.user ? navLink('社区', 'community') : ''}
          </div>
          <div class="flex items-center gap-2">
            ${state.user ? `
              <div class="hidden sm:flex items-center gap-2 bg-indigo-50 px-3 py-1.5 rounded-full">
                <span class="text-yellow-500">⭐</span>
                <span class="font-semibold text-indigo-700 text-sm" id="xp_badge">加载中...</span>
              </div>
              <div class="flex items-center gap-2 bg-white border border-slate-200 px-3 py-1.5 rounded-full">
                <div class="w-6 h-6 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white text-xs font-bold">${state.user.username[0].toUpperCase()}</div>
                <span class="text-sm text-slate-700 font-medium">${state.user.username}</span>
              </div>
              <button onclick="logout()" class="text-slate-400 hover:text-red-500 text-sm px-2">退出</button>
            ` : `
              <button onclick="navigate('login')" class="px-4 py-2 text-sm font-medium text-slate-700 hover:text-indigo-600">登录</button>
              <button onclick="navigate('register')" class="px-4 py-2 text-sm font-medium text-white gradient-bg rounded-lg hover:opacity-90">免费注册</button>
            `}
          </div>
        </div>
      `;
      return nav;
    }

    function navLink(label, page) {
      const active = state.currentPage === page ? 'bg-indigo-100 text-indigo-700' : 'text-slate-600 hover:bg-slate-100';
      return `<button onclick="navigate('${page}')" class="px-4 py-2 rounded-lg text-sm font-medium ${active}">${label}</button>`;
    }

    function renderFooter() {
      const foot = document.createElement('footer');
      foot.className = 'mt-16 border-t border-slate-200 bg-white/50';
      foot.innerHTML = `
        <div class="max-w-7xl mx-auto px-4 py-8 text-center text-sm text-slate-500">
          <div class="mb-2 font-bold text-slate-700">🌍 LinguaEdu · 让世界语言触手可及</div>
          <div>© 2026 LinguaEdu Platform · 支持英语、日语、韩语等主流语言学习</div>
        </div>
      `;
      return foot;
    }

    async function renderHome() {
      if (state.user) {
        try {
          const stats = await api.get('/api/stats');
          $('xp_badge').textContent = `${stats.totalXp} XP`;
        } catch(e) {}
        // 加载继续学习记忆
        try {
          const cont = await api.get('/api/continue');
          if (cont && cont.course_id) {
            state.continueLearning = cont;
          }
        } catch(e) {}
      }
      const continueCard = state.user && state.continueLearning ? `
        <section class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-6 mb-8 text-white shadow-lg">
          <div class="flex items-center justify-between flex-wrap gap-4">
            <div class="flex items-center gap-4">
              <div class="text-5xl">▶️</div>
              <div>
                <div class="text-sm text-indigo-100">继续上次的学习</div>
                <div class="text-xl font-bold">${state.continueLearning.course_id} · 课时 ${state.continueLearning.lesson_id}</div>
                <div class="text-xs text-indigo-200 mt-1">更新于 ${new Date(state.continueLearning.updated_at).toLocaleString('zh-CN')}</div>
              </div>
            </div>
            <button id="continue_btn" class="px-6 py-3 bg-white text-indigo-600 font-semibold rounded-xl hover:bg-indigo-50">继续学习 →</button>
          </div>
        </section>
      ` : '';
      this.innerHTML = `
        ${continueCard}
        <section class="py-12 md:py-20 text-center">
          <div class="inline-block px-4 py-1.5 bg-indigo-100 text-indigo-700 rounded-full text-sm font-medium mb-6">🚀 沉浸式语言学习平台</div>
          <h1 class="text-4xl md:text-6xl font-extrabold text-slate-900 mb-6 leading-tight">
            掌握一门新语言<br/>
            <span class="bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">从未如此简单</span>
          </h1>
          <p class="text-lg text-slate-600 max-w-2xl mx-auto mb-8">通过互动式课程、智能推荐和社区激励，开启你的英语、日语、韩语学习之旅。</p>
          <div class="flex gap-4 justify-center flex-wrap">
            <button onclick="navigate('courses')" class="px-8 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 shadow-lg shadow-indigo-200">开始学习 →</button>
            ${!state.user ? `<button onclick="navigate('register')" class="px-8 py-3 bg-white text-indigo-600 font-semibold rounded-xl border-2 border-indigo-200 hover:border-indigo-400">注册账号</button>` : ''}
            ${state.user ? `<button onclick="navigate('placement')" class="px-8 py-3 bg-amber-100 text-amber-700 font-semibold rounded-xl border-2 border-amber-200 hover:border-amber-400">📝 水平测试</button>` : ''}
          </div>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 my-12">
          ${featureCard('📚', '分级课程体系', '从入门到精通，CEFR/JLPT/TOPIK 难度对标')}
          ${featureCard('🎯', '互动式学习', '单词记忆、语法练习、口语跟读、AI情景对话')}
          ${featureCard('📊', '进度追踪', '可视化学习数据、能力雷达图、结课证书')}
        </section>

        <section class="bg-white rounded-3xl shadow-sm p-8 md:p-12">
          <h2 class="text-2xl md:text-3xl font-bold text-slate-900 mb-8 text-center">支持学习的语言</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            ${languageCard('en', '英语', '🇬🇧', 'from-blue-500 to-indigo-600')}
            ${languageCard('ja', '日语', '🇯🇵', 'from-pink-500 to-red-500')}
            ${languageCard('ko', '韩语', '🇰🇷', 'from-purple-500 to-indigo-500')}
          </div>
        </section>

        ${state.user ? `
        <section class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-8">
          ${shortcutCard('🎭', 'AI情景对话', 'scenario', 'from-amber-100 to-orange-100')}
          ${shortcutCard('📋', '学习计划', 'studyplan', 'from-pink-100 to-rose-100')}
          ${shortcutCard('🏅', '我的证书', 'certificates', 'from-emerald-100 to-green-100')}
          ${shortcutCard('📊', '学习报告', 'report', 'from-sky-100 to-blue-100')}
          ${shortcutCard('🎥', '直播导学', 'live', 'from-red-100 to-pink-100')}
          ${shortcutCard('📝', '水平测试', 'placement', 'from-yellow-100 to-amber-100')}
          ${shortcutCard('🔔', '学习提醒', 'reminders', 'from-violet-100 to-purple-100')}
          ${shortcutCard('🏆', '成就墙', 'achievements', 'from-fuchsia-100 to-rose-100')}
        </section>` : ''}
      `;
      if (state.continueLearning) {
        const cb = $('continue_btn');
        if (cb) cb.onclick = async () => {
          const all = await api.get('/api/courses');
          const c = all.find(x => x.id === state.continueLearning.course_id);
          if (!c) return navigate('courses');
          const l = c.lessons.find(x => x.id === state.continueLearning.lesson_id) || c.lessons[0];
          navigate('lesson', { currentCourse: c, currentLesson: l });
        };
      }
    }

    function shortcutCard(icon, label, page, gradient) {
      return `
        <button onclick="navigate('${page}')" class="bg-gradient-to-br ${gradient} rounded-2xl p-4 card-hover text-left">
          <div class="text-3xl mb-1">${icon}</div>
          <div class="text-sm font-semibold text-slate-800">${label}</div>
        </button>
      `;
    }

    function featureCard(icon, title, desc) {
      return `
        <div class="bg-white rounded-2xl p-6 card-hover border border-slate-100">
          <div class="text-4xl mb-4">${icon}</div>
          <h3 class="font-bold text-lg text-slate-900 mb-2">${title}</h3>
          <p class="text-slate-600 text-sm">${desc}</p>
        </div>
      `;
    }

    function languageCard(lang, name, flag, gradient) {
      return `
        <div onclick="navigate('courses', {filter_lang: '${lang}'})" class="cursor-pointer rounded-2xl p-6 bg-gradient-to-br ${gradient} text-white card-hover">
          <div class="text-5xl mb-3">${flag}</div>
          <div class="text-2xl font-bold">${name}</div>
          <div class="text-white/80 text-sm mt-1">点击开始学习 →</div>
        </div>
      `;
    }

    function renderLogin() {
      this.innerHTML = authForm('登录账户', false);
      bindAuthForm(false);
    }

    function renderRegister() {
      this.innerHTML = authForm('创建账户', true);
      bindAuthForm(true);
    }

    function authForm(title, isRegister) {
      const parts = [];
      parts.push(`<div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-8 mt-10">`);
      parts.push(`<h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">${title}</h2>`);
      parts.push(`<div class="space-y-4">`);
      if (isRegister) {
        parts.push(`<div>
          <label class="block text-sm font-medium text-slate-700 mb-1">用户名</label>
          <input id="f_username" type="text" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none" placeholder="请输入用户名" />
        </div>`);
      }
      parts.push(`<div>
        <label class="block text-sm font-medium text-slate-700 mb-1">${isRegister ? '邮箱' : '用户名 / 邮箱'}</label>
        <input id="f_login" type="${isRegister ? 'email' : 'text'}" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none" placeholder="${isRegister ? 'your@email.com' : '请输入用户名或邮箱'}" />
      </div>`);
      parts.push(`<div>
        <label class="block text-sm font-medium text-slate-700 mb-1">密码</label>
        <input id="f_password" type="password" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none" placeholder="至少6位" />
      </div>`);
      if (isRegister) {
        parts.push(`<div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">母语</label>
            <select id="f_native" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
              <option value="zh">中文</option>
              <option value="en">英语</option>
              <option value="ja">日语</option>
              <option value="ko">韩语</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">学习目标</label>
            <select id="f_target" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
              <option value="en">英语</option>
              <option value="ja">日语</option>
              <option value="ko">韩语</option>
            </select>
          </div>
        </div>`);
      }
      parts.push(`<div id="auth_msg" class="text-sm hidden"></div>`);
      parts.push(`<button id="auth_submit" class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700">${isRegister ? '立即注册' : '登录'}</button>`);
      parts.push(`<div class="text-center text-sm text-slate-600">
        ${isRegister ? '已有账户？' : '还没有账户？'}
        <a href="#" onclick="navigate('${isRegister ? 'login' : 'register'}')" class="text-indigo-600 font-medium hover:underline">${isRegister ? '去登录' : '立即注册'}</a>
      </div>`);
      parts.push(`</div></div>`);
      return parts.join('');
    }

    function bindAuthForm(isRegister) {
      $('auth_submit').onclick = async () => {
        const msg = $('auth_msg');
        msg.classList.add('hidden');
        try {
          let data;
          if (isRegister) {
            data = {
              username: $('f_username').value.trim(),
              email: $('f_login').value.trim(),
              password: $('f_password').value,
              native_language: $('f_native').value,
              target_language: $('f_target').value
            };
          } else {
            data = {
              login: $('f_login').value.trim(),
              password: $('f_password').value
            };
          }
          const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';
          const res = await api.post(endpoint, data);
          if (res.error) {
            msg.textContent = res.error;
            msg.className = 'text-sm text-red-600';
            msg.classList.remove('hidden');
            return;
          }
          saveAuth(res);
          navigate('dashboard');
        } catch (e) {
          msg.textContent = '网络错误，请重试';
          msg.className = 'text-sm text-red-600';
          msg.classList.remove('hidden');
        }
      };
    }

    async function renderCourses() {
      const lang = state.filter_lang || '';
      const filterGoal = state.filter_goal || '';
      const filterDuration = state.filter_duration || '';
      const filterTextbook = state.filter_textbook || '';
      const searchQ = state.search_q || '';
      const params = new URLSearchParams();
      if (lang) params.set('language', lang);
      if (filterGoal) params.set('goal', filterGoal);
      if (filterDuration) params.set('duration', filterDuration);
      if (filterTextbook) params.set('textbook', filterTextbook);
      if (searchQ) params.set('q', searchQ);
      const url = '/api/courses/search' + (params.toString() ? '?' + params.toString() : '');
      const [filtered, filters] = await Promise.all([
        api.get(url),
        api.get('/api/courses/filters')
      ]);
      const GOAL_LABELS = { conversation: '日常对话', travel: '旅游出行', business: '职场商务', study: '考级/学习' };
      const DUR_LABELS = { short: '短训班(≤6)', medium: '系统班(7-15)', long: '长期班(>15)' };

      // 热门 TOP 3：模拟"本月热门"
      const HOT_TOP3 = filtered.slice(0, 3);
      // 新上线标识：取最后 3 门（按 id 倒序）
      const NEW_COURSES = [...filtered].reverse().slice(0, 3);

      this.innerHTML = `
        <div class="mb-6">
          <h1 class="text-3xl font-bold text-slate-900 mb-2">课程中心</h1>
          <p class="text-slate-600">选择语言、目标、时长，精准找到适合你的课程</p>
        </div>

        ${!searchQ && !filterGoal && !filterDuration && !filterTextbook && !lang ? `
          <div class="grid md:grid-cols-2 gap-5 mb-6">
            <div class="bg-gradient-to-r from-rose-100 to-pink-100 rounded-2xl p-5 border-2 border-pink-200">
              <div class="flex items-center gap-2 mb-3">
                <span class="text-2xl">🔥</span>
                <h3 class="font-bold text-slate-900">本月热门 TOP 3</h3>
              </div>
              <div class="space-y-2">
                ${HOT_TOP3.map((c, i) => `
                  <div data-course-sid="${storeObj('course', c)}" class="js-hot-card cursor-pointer flex items-center gap-3 p-2 bg-white/70 rounded-lg hover:bg-white">
                    <div class="text-2xl font-bold text-pink-600 w-8 text-center">${i+1}</div>
                    <div class="text-2xl">${c.cover}</div>
                    <div class="flex-1 min-w-0">
                      <div class="font-semibold text-slate-900 text-sm truncate">${c.title}</div>
                      <div class="text-xs text-slate-500">${c.languageName} · ${c.levelName} · ${c.lessons.length}课时</div>
                    </div>
                    <span class="text-xs text-pink-600 font-medium">→</span>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="bg-gradient-to-r from-emerald-100 to-teal-100 rounded-2xl p-5 border-2 border-emerald-200">
              <div class="flex items-center gap-2 mb-3">
                <span class="text-2xl">✨</span>
                <h3 class="font-bold text-slate-900">新上线课程</h3>
              </div>
              <div class="space-y-2">
                ${NEW_COURSES.map(c => `
                  <div data-course-sid="${storeObj('course', c)}" class="js-hot-card cursor-pointer flex items-center gap-3 p-2 bg-white/70 rounded-lg hover:bg-white">
                    <div class="text-2xl">${c.cover}</div>
                    <div class="flex-1 min-w-0">
                      <div class="font-semibold text-slate-900 text-sm truncate">${c.title}</div>
                      <div class="text-xs text-slate-500">${c.languageName} · ${c.levelName}</div>
                    </div>
                    <span class="px-2 py-0.5 bg-emerald-500 text-white text-[10px] rounded-full">NEW</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        ` : ''}

        <div class="bg-white rounded-2xl p-4 mb-6 shadow-sm">
          <div class="flex gap-2 mb-3 flex-wrap">
            <input id="search_input" type="text" value="${searchQ}" placeholder="🔍 搜索课程：零基础、商务、考级..." class="flex-1 min-w-[200px] px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none" />
            <button id="search_btn" class="px-5 py-2.5 bg-indigo-600 text-white rounded-lg font-medium">搜索</button>
          </div>
          <div class="flex gap-2 flex-wrap items-center">
            <span class="text-sm text-slate-500">语言：</span>
            ${filterButton('', '全部')}

    async function renderCourse() {
      const c = state.currentCourse;
      if (!c) return navigate('courses');
      const courseSid = storeObj('course', c);
      // 拉取解锁状态 & 进度
      let unlocked = c.lessons.map(l => l.id);
      let completedMap = {};
      if (state.user) {
        try {
          const r = await api.get('/api/lesson-unlock?course_id=' + c.id);
          unlocked = r.unlocked;
          const prog = await api.get('/api/progress');
          prog.forEach(p => { if (p.completed) completedMap[p.lesson_id] = true; });
        } catch(e) {}
      }
      const completedCount = c.lessons.filter(l => completedMap[l.id]).length;
      const totalCount = c.lessons.length;
      const percent = totalCount ? Math.round(completedCount / totalCount * 100) : 0;
      // 估算剩余天数（假设每天1课）
      const remaining = totalCount - completedCount;
      const estDays = remaining > 0 ? `约 ${remaining} 天` : '已完成 🎉';

      this.innerHTML = `
        <div class="mb-6">
          <button class="js-back-courses text-sm text-indigo-600 hover:underline mb-2">← 返回课程列表</button>
          <div class="flex items-center gap-3 mb-2 flex-wrap">
            <div class="text-5xl">${c.cover}</div>
            <div class="flex-1">
              <h1 class="text-3xl font-bold text-slate-900">${c.title}</h1>
              <p class="text-slate-600">${c.description}</p>
              <div class="flex flex-wrap gap-2 mt-2">
                <span class="text-xs px-2 py-1 bg-amber-100 text-amber-700 rounded-full">🎯 ${c.difficulty}</span>
                <span class="text-xs px-2 py-1 bg-emerald-100 text-emerald-700 rounded-full">📖 ${c.textbook}</span>
                <span class="text-xs px-2 py-1 bg-pink-100 text-pink-700 rounded-full">⏱️ ${c.durationCategory === 'short' ? '短训班' : c.durationCategory === 'medium' ? '系统班' : '长期班'}</span>
              </div>
            </div>
            <button class="js-preview-btn px-4 py-2 bg-white border border-indigo-200 text-indigo-600 rounded-lg text-sm font-medium" data-course-sid="${courseSid}">👁 课程预览</button>
          </div>
          ${state.user ? `
            <div class="mt-4 bg-white rounded-xl p-4 border border-slate-100">
              <div class="flex items-center justify-between text-sm text-slate-600 mb-2">
                <span>学习进度：${completedCount} / ${totalCount} 课时</span>
                <span class="text-indigo-600 font-medium">${percent}% · ${estDays}</span>
              </div>
              <div class="w-full bg-slate-100 rounded-full h-2.5">
                <div class="bg-gradient-to-r from-indigo-500 to-purple-500 h-2.5 rounded-full transition-all" style="width: ${percent}%"></div>
              </div>
            </div>` : ''}
        </div>
        <div class="grid gap-4">
          ${c.lessons.map((l, i) => lessonCard(c, l, i, unlocked.includes(l.id), completedMap[l.id])).join('')}
        </div>
        ${state.user && completedCount === totalCount && totalCount > 0 ? `
          <div class="mt-8 bg-gradient-to-r from-yellow-100 to-amber-100 border-2 border-amber-300 rounded-2xl p-6 text-center">
            <div class="text-5xl mb-2">🎓</div>
            <h3 class="text-2xl font-bold text-amber-800 mb-2">恭喜！你已完成本课程全部课时</h3>
            <p class="text-amber-700 mb-4">通过测验即可获得结课证书</p>
            <button id="issue_cert_btn" class="px-6 py-3 bg-amber-600 text-white font-semibold rounded-xl">🏅 申请结课证书</button>
          </div>` : ''}
        ${state.user && completedCount >= 3 ? `
          <div class="mt-6 bg-white rounded-2xl p-5 border border-slate-100">
            <div class="flex items-center justify-between flex-wrap gap-3">
              <div>
                <h3 class="font-bold text-slate-900">📋 单元综合测验</h3>
                <p class="text-sm text-slate-500">每 3 课时一个单元，答对 60% 即可通过</p>
              </div>
              <button id="start_unit_test" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl font-medium">开始测验 →</button>
            </div>
          </div>` : ''}
      `;
      document.querySelectorAll('.js-lesson-card').forEach(el => {
        if (el.classList.contains('locked')) return;
        el.onclick = () => {
          const course = getStored('course', el.dataset.courseSid);
          const lesson = getStored('lesson', el.dataset.lessonSid);
          navigate('lesson', { currentCourse: course, currentLesson: lesson });
        };
      });
      document.querySelector('.js-back-courses').onclick = () => navigate('courses');
      document.querySelectorAll('.js-preview-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const course = getStored('course', btn.dataset.courseSid);
          showCoursePreview(course);
        };
      });
      const certBtn = $('issue_cert_btn');
      if (certBtn) certBtn.onclick = async () => {
        const r = await api.post('/api/certificate/issue', { course_id: c.id, course_title: c.title, score: 100 });
        if (r.success) {
          alert('🎉 证书已生成！前往「我的证书」查看');
          navigate('certificates');
        }
      };
      const unitBtn = $('start_unit_test');
      if (unitBtn) unitBtn.onclick = () => navigate('unit_test', { unitCourseId: c.id, unitIndex: 0, currentCourse: c });

      const typeNames = { pronunciation: '发音', conversation: '会话', grammar: '语法', numbers: '数字', scenario: '情景', business: '商务', writing: '写作', listening: '听力', speaking: '口语' };

    async function renderLesson() {
      const course = state.currentCourse;
      const lesson = state.currentLesson;
      if (!course || !lesson) return navigate('courses');

      // 记录继续学习
      if (state.user) {
        api.post('/api/continue', { course_id: course.id, lesson_id: lesson.id }).catch(() => {});
      }

      const tabs = [
        { id: 'vocab', label: '📖 单词', render: renderVocabulary },
        { id: 'grammar', label: '📝 语法', render: renderGrammar },
        { id: 'speaking', label: '🎤 口语', render: renderSpeaking },
        { id: 'listening', label: '🎧 听力', render: renderListening },
        { id: 'quiz', label: '✏️ 测验', render: renderLessonQuiz }
      ];

      this.innerHTML = `
        <div class="mb-4">
          <button class="js-back-course text-sm text-indigo-600 hover:underline mb-2">← 返回课程</button>
          <h1 class="text-2xl font-bold text-slate-900">${course.title}</h1>
          <h2 class="text-lg text-slate-600">${lesson.title}</h2>
        </div>
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
          ${tabs.map((t, i) => `<button data-tab="${t.id}" class="lesson-tab px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap ${i === 0 ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">${t.label}</button>`).join('')}

        <div id="lesson_content" class="bg-white rounded-2xl p-6 min-h-[400px]"></div>
        <div class="mt-6 flex gap-3 flex-wrap">
          <button id="complete_btn" class="flex-1 min-w-[160px] py-3 bg-green-600 text-white font-semibold rounded-xl hover:bg-green-700">完成本课 ✓</button>
          <button class="js-back-course2 px-6 py-3 bg-white border border-slate-200 text-slate-700 font-semibold rounded-xl hover:border-indigo-400">返回课时列表</button>
        </div>
      `;

      let currentTab = tabs[0].id;
      const contentEl = $('lesson_content');

      function renderTab() {
        const tab = tabs.find(t => t.id === currentTab);

        btn.onclick = () => {
          currentTab = btn.dataset.tab;
          document.querySelectorAll('.lesson-tab').forEach(b => {
            b.className = 'lesson-tab px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap ' + (b.dataset.tab === currentTab ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700');

    function renderLessonQuiz(container, course, lesson) {
      const quiz = lesson.quiz || [];
      if (quiz.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-slate-500">本课时暂无测验</div>';
        return;
      }
      let answers = new Array(quiz.length).fill(-1);
      let submitted = false;

      function render() {
        container.innerHTML = `
          <div class="fade-in">
            <div class="mb-6">
              <h3 class="text-xl font-bold text-slate-900 mb-1">✏️ 随堂测验（${quiz.length}题）</h3>
              <p class="text-sm text-slate-500">答对60%即可解锁下一课</p>
            </div>
            <div class="space-y-6">
              ${quiz.map((q, qi) => `
                <div class="bg-slate-50 rounded-xl p-5" data-qi="${qi}">
                  <div class="font-medium text-slate-900 mb-3">${qi + 1}. ${q.question}</div>
                  <div class="space-y-2">
                    ${q.options.map((o, oi) => `
                      <button data-qi="${qi}" data-oi="${oi}" class="quiz-opt w-full p-3 bg-white rounded-lg text-left border-2 ${submitted ? (oi === q.answer ? 'border-green-500 bg-green-50' : (answers[qi] === oi ? 'border-red-500 bg-red-50' : 'border-transparent')) : (answers[qi] === oi ? 'border-indigo-500' : 'border-transparent hover:border-indigo-300')}">${String.fromCharCode(65 + oi)}. ${o}</button>
                    `).join('')}
                  </div>
                  ${submitted ? `<div class="text-sm mt-2 ${answers[qi] === q.answer ? 'text-green-600' : 'text-red-600'}">${answers[qi] === q.answer ? '✓ 正确' : '✗ 错误，正确答案：' + q.options[q.answer]}</div>` : ''}
                </div>
              `).join('')}
            </div>
            ${!submitted ? `<button id="quiz_submit" class="mt-6 w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl">提交答案</button>` : `

    function renderSpeaking(container, course, lesson) {
      const dialogues = lesson.dialogue || [];
      let index = 0;
      let score = 0;
      const langMap = { en: 'en-US', ja: 'ja-JP', ko: 'ko-KR' };
      const langKey = course.language === 'en' ? 'en' : course.language === 'ja' ? 'ja' : 'ko';

      function playAudio(text) {
        if (!window.speechSynthesis) return;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = langMap[course.language] || 'en-US';
        utter.rate = 0.9;
        window.speechSynthesis.speak(utter);
      }

      function speakAndScore(targetText) {
        return new Promise((resolve) => {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SR) {
            // 浏览器不支持则用随机模拟
            const randScore = Math.floor(Math.random() * 15) + 5;
            resolve({ score: randScore, transcript: '(浏览器不支持语音识别)', accuracy: randScore / 20 });
            return;
          }
          const rec = new SR();
          rec.lang = langMap[course.language] || 'en-US';
          rec.interimResults = false;
          rec.maxAlternatives = 1;
          let resolved = false;
          rec.onresult = (e) => {
            if (resolved) return; resolved = true;
            const transcript = e.results[0][0].transcript.trim();
            // 简单匹配评分：计算字符相似度
            const norm = (s) => s.toLowerCase().replace(/[.,!?;:'"。，！？；：]/g, '').replace(/\s+/g, ' ').trim();
            const target = norm(targetText);
            const heard = norm(transcript);
            // Levenshtein 相似度
            const dist = levenshtein(target, heard);
            const maxLen = Math.max(target.length, heard.length, 1);
            const accuracy = Math.max(0, 1 - dist / maxLen);
            // 流利度：基于命中率 + 长度比例
            const lengthRatio = heard.length / Math.max(target.length, 1);
            const fluency = Math.min(1, lengthRatio) * 0.7 + accuracy * 0.3;
            // 完整度：是否包含核心关键词
            const targetWords = target.split(/\s+/).filter(w => w.length > 1);
            const matched = targetWords.filter(w => heard.includes(w)).length;
            const completeness = targetWords.length ? matched / targetWords.length : 0;
            const final = Math.round((accuracy * 0.5 + fluency * 0.3 + completeness * 0.2) * 20);
            resolve({ score: Math.max(1, final), transcript, accuracy, fluency, completeness });
          };
          rec.onerror = (e) => {
            if (resolved) return; resolved = true;
            resolve({ score: 8, transcript: '(识别失败: ' + e.error + ')', accuracy: 0.4 });
          };
          rec.onend = () => {
            if (!resolved) { resolved = true; resolve({ score: 5, transcript: '(未检测到语音)', accuracy: 0.25 }); }
          };
          try { rec.start(); } catch (e) {
            if (!resolved) { resolved = true; resolve({ score: 8, transcript: '(启动失败)', accuracy: 0.4 }); }
          }
          // 10秒超时
          setTimeout(() => {
            if (!resolved) { resolved = true; try { rec.stop(); } catch(e){}; resolve({ score: 5, transcript: '(超时)', accuracy: 0.25 }); }
          }, 10000);
        });
      }

          const result = await speakAndScore(target);
          score += result.score;
          const el = $('speak_result');
          const accuracy = Math.round((result.accuracy || 0) * 100);
          const fluency = Math.round((result.fluency || 0) * 100);

          const emoji = result.score >= 16 ? '🌟' : result.score >= 12 ? '👍' : result.score >= 8 ? '💪' : '🔁';
          const msg = result.score >= 16 ? '发音很棒！' : result.score >= 12 ? '不错哦！' : result.score >= 8 ? '再练练更好！' : '需要复习';
          el.innerHTML = `

                <div class="bg-indigo-50 rounded p-2"><div class="text-slate-500">准确度</div><div class="font-bold text-indigo-700">${accuracy}%</div></div>
                <div class="bg-pink-50 rounded p-2"><div class="text-slate-500">流利度</div><div class="font-bold text-pink-700">${fluency}%</div></div>
                <div class="bg-emerald-50 rounded p-2"><div class="text-slate-500">完整度</div><div class="font-bold text-emerald-700">${completeness}%</div></div>
              </div>
              <div class="text-xs text-slate-500 mt-2">听到：${result.transcript}</div>
            </div>
          `;
          btn.disabled = false;
          btn.innerHTML = '<span class="inline-block w-4 h-6 bg-white rounded speaking-wave"></span> 再试一次';
          setTimeout(() => { index++; showDialogue(); }, 3000);

    }

    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          dp[i][j] = a[i - 1] === b[j - 1]
            ? dp[i - 1][j - 1]
            : Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]) + 1;
        }
      }
      return dp[m][n];
    }

    function renderListening(container, course, lesson) {
      const dialogues = lesson.dialogue || [];
      let index = 0;
      let correct = 0;

      // 预收集本课所有对话的中文翻译 + 词汇翻译，作为干扰项题库
      const allTranslations = dialogues.map(d => d.zh).filter(Boolean);
      const vocabTranslations = (lesson.vocabulary || []).map(v => v.translation).filter(Boolean);
      const distractorPool = [...new Set([...allTranslations, ...vocabTranslations])];

      function pickDistractors(correctAns, count) {
        const pool = distractorPool.filter(t => t && t !== correctAns);
        // Fisher-Yates 随机抽取
        const shuffled = [...pool].sort(() => Math.random() - 0.5);
        const picked = shuffled.slice(0, count);
        // 如果题库不够，补充通用干扰项（每题不同组合）
        const fallbacks = [
          '请再说一遍', '我不太确定', '能慢一点吗',
          '这个很难', '让我想想', '没关系',
          '稍等一下', '很高兴', '没关系'
        ];
        let fi = 0;
        while (picked.length < count) {
          const fb = fallbacks[fi % fallbacks.length];
          if (!picked.includes(fb) && fb !== correctAns) picked.push(fb);
          fi++;
        }
        return picked;
      }

      function playAudio(text, lang) {
        if (!window.speechSynthesis) return;
        const utter = new SpeechSynthesisUtterance(text);
        const langMap = { en: 'en-US', ja: 'ja-JP', ko: 'ko-KR' };
        utter.lang = langMap[lang] || 'en-US';
        utter.rate = 0.85;
        window.speechSynthesis.speak(utter);

        container.innerHTML = `

            </div>
            <div id="listen_result" class="mt-4 text-center text-sm font-medium hidden"></div>

          const utter = new SpeechSynthesisUtterance(target);

            renderQuiz();
          };
        });
        $('submit_placement').onclick = async () => {
          if (answers.some(a => a < 0)) { alert('请先完成所有题目'); return; }
          const questions = PLACEMENT_QUESTIONS[lang] || PLACEMENT_QUESTIONS.en;
          const score = answers.filter((a, i) => a === questions[i].a).length;
          let rec;
          if (score <= 2) rec = 'beginner';

          await api.post('/api/placement/submit', { language: lang, score, recommended_level: rec, answers });
          renderResult(score, rec, questions.length);

    function drawCertificate(canvas, name, course, date) {
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#fef3c7');
      bg.addColorStop(0.5, '#fde68a');
      bg.addColorStop(1, '#fcd34d');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#92400e';
      ctx.lineWidth = 8;
      ctx.strokeRect(20, 20, W - 40, H - 40);
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2;
      ctx.strokeRect(35, 35, W - 70, H - 70);
      ctx.fillStyle = '#78350f';
      ctx.font = 'bold 36px serif';
      ctx.textAlign = 'center';
      ctx.fillText('🎓 结课证书', W/2, 100);
      ctx.font = 'italic 20px serif';
      ctx.fillText('Certificate of Completion', W/2, 135);
      ctx.font = '18px sans-serif';
      ctx.fillStyle = '#451a03';
      ctx.fillText('兹证明', W/2, 200);
      ctx.font = 'bold 42px serif';
      ctx.fillStyle = '#7c2d12';
      ctx.fillText(name, W/2, 260);
      ctx.strokeStyle = '#92400e';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(W/2 - 200, 280); ctx.lineTo(W/2 + 200, 280);
      ctx.stroke();
      ctx.font = '18px sans-serif';
      ctx.fillStyle = '#451a03';
      ctx.fillText('已圆满完成课程', W/2, 330);
      ctx.font = 'bold 26px sans-serif';
      ctx.fillStyle = '#7c2d12';
      ctx.fillText(course, W/2, 370);
      ctx.font = '18px sans-serif';
      ctx.fillStyle = '#451a03';
      ctx.fillText('签发日期：' + date, W/2, 430);
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(W - 130, H - 100, 50, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('LinguaEdu', W - 130, H - 95);
      ctx.font = '12px sans-serif';
      ctx.fillText('CERTIFIED', W - 130, H - 75);
    }

    function drawRadarSVG(ability) {
      if (!ability) return '<div class="text-slate-500 text-center py-8">暂无能力数据</div>';
      const dims = [
        { key: 'listening', label: '听力' },
        { key: 'speaking', label: '口语' },
        { key: 'reading', label: '阅读' },
        { key: 'writing', label: '写作' },
        { key: 'vocabulary', label: '词汇' }
      ];
      const cx = 110, cy = 110, r = 80;
      const points = dims.map((d, i) => {
        const angle = (Math.PI * 2 * i) / dims.length - Math.PI / 2;
        const v = (ability[d.key] || 50) / 100;
        return { x: cx + Math.cos(angle) * r * v, y: cy + Math.sin(angle) * r * v, label: d.label, angle, v };
      });
      const polyPts = points.map(p => p.x + ',' + p.y).join(' ');
      const gridCircles = [0.25, 0.5, 0.75, 1].map(s => {
        return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r * s) + '" fill="none" stroke="#e2e8f0" stroke-dasharray="3,3" />';
      }).join('');
      const gridLines = dims.map((_, i) => {
        const angle = (Math.PI * 2 * i) / dims.length - Math.PI / 2;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        return '<line x1="' + cx + '" y1="' + cy + '" x2="' + x + '" y2="' + y + '" stroke="#cbd5e1" />';
      }).join('');
      const labels = points.map(p => {
        const lx = cx + Math.cos(p.angle) * (r + 20);
        const ly = cy + Math.sin(p.angle) * (r + 20);
        return '<text x="' + lx + '" y="' + ly + '" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="#475569">' + p.label + '</text>';
      }).join('');
      return '<svg viewBox="0 0 220 220" class="w-full max-w-[240px] mx-auto">' + gridCircles + gridLines +
        '<polygon points="' + polyPts + '" fill="rgba(99,102,241,0.3)" stroke="#6366f1" stroke-width="2" />' +
        points.map(p => '<circle cx="' + p.x + '" cy="' + p.y + '" r="3" fill="#6366f1" />').join('') + labels +
        '</svg>' +
        '<div class="grid grid-cols-5 gap-1 mt-2 text-center text-xs">' +
        dims.map(d => '<div><div class="text-slate-500">' + d.label + '</div><div class="font-bold text-indigo-600">' + (ability[d.key] || 50) + '</div></div>').join('') +
        '</div>';
    }

      const langNames = { en: '英语', ja: '日语', ko: '韩语' };
      let index = 0;
      const self = this;

      function play(text) {
        if (!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = langMap[lang] || 'en-US';
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
      }

      function speakAndCheck() {
        return new Promise((resolve) => {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SR) { resolve({ ok: true, transcript: '' }); return; }
          const rec = new SR();
          rec.lang = langMap[lang] || 'en-US';
          let resolved = false;
          rec.onresult = (e) => { if (resolved) return; resolved = true; resolve({ ok: true, transcript: e.results[0][0].transcript.trim() }); };
          rec.onerror = () => { if (resolved) return; resolved = true; resolve({ ok: true, transcript: '' }); };
          rec.onend = () => { if (!resolved) { resolved = true; resolve({ ok: true, transcript: '' }); } };
          try { rec.start(); } catch(e) { if (!resolved) { resolved = true; resolve({ ok: true, transcript: '' }); } }
          setTimeout(() => { if (!resolved) { resolved = true; try { rec.stop(); } catch(e){}; resolve({ ok: true, transcript: '' }); } }, 8000);
        });
      }

      function showStep() {
        if (index >= sc.steps.length) {
          self.innerHTML = `

              </div>
            </div>
          `;
          return;
        }
        const step = sc.steps[index];
        const isAI = step.speaker !== '我';
        self.innerHTML = `
          <div class="bg-gradient-to-br ${sc.bg} rounded-2xl p-6 mb-4">
            <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
              <button class="text-sm text-indigo-600 hover:underline" onclick="navigate('scenario')">← 返回</button>
              <div class="text-sm text-slate-700">${sc.name} · ${index+1}/${sc.steps.length} · ${langNames[lang]}</div>
            </div>
            <div class="text-center py-4">
              <div class="text-xs text-slate-500 mb-1">${step.speaker}</div>
              <div class="text-3xl md:text-4xl font-bold text-slate-900 mb-2">${step[langKey] || step.zh}</div>
              <div class="text-base text-slate-600">${step.zh}</div>
            </div>
          </div>
          <div class="bg-white rounded-2xl p-5 border border-slate-100">
            <div class="flex gap-2 mb-4 flex-wrap">
              <button id="play_cur" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm">🔊 听 ${step.speaker} 怎么说</button>
              <button id="slow_cur" class="px-4 py-2 bg-white border border-indigo-200 text-indigo-600 rounded-lg text-sm">🐢 慢速</button>
            </div>
            ${isAI ? `
              <div class="text-center text-sm text-slate-500 mb-3">👆 听完后，点击下方继续下一句</div>
              <button id="next_step" class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-semibold rounded-xl">继续 →</button>
            ` : `
              <div class="text-center text-sm text-slate-500 mb-3">轮到你了，模仿跟读：</div>
              <button id="mic_btn" class="w-full py-4 bg-gradient-to-r from-pink-500 to-red-500 text-white rounded-2xl font-bold text-lg inline-flex items-center justify-center gap-3">
                <span class="inline-block w-4 h-6 bg-white rounded speaking-wave"></span> 按住说话
              </button>
              <div id="mic_result" class="mt-3 text-sm text-slate-600 text-center"></div>
              <button id="skip_speak" class="w-full mt-2 py-2 text-slate-500 text-sm">跳过跟读，直接下一句</button>
            `}
          </div>
        `;
        $('play_cur').onclick = () => play(step[langKey] || step.zh);
        $('slow_cur').onclick = () => {
          if (!window.speechSynthesis) return;
          const u = new SpeechSynthesisUtterance(step[langKey] || step.zh);
          u.lang = langMap[lang] || 'en-US';
          u.rate = 0.55;
          window.speechSynthesis.speak(u);
        };
        if (isAI) {
          $('next_step').onclick = () => { index++; showStep(); };
        } else {
          $('mic_btn').onclick = async () => {
            const btn = $('mic_btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="inline-block w-4 h-6 bg-white rounded speaking-wave"></span> 正在聆听...';
            const r = await speakAndCheck();
            $('mic_result').textContent = r.transcript ? '你说：' + r.transcript : '(未检测到语音)';
            btn.disabled = false;
            btn.innerHTML = '<span class="inline-block w-4 h-6 bg-white rounded speaking-wave"></span> 再试一次';
            setTimeout(() => { index++; showStep(); }, 1500);
          };
          const sk = $('skip_speak');
          if (sk) sk.onclick = () => { index++; showStep(); };
        }
      }
      showStep();
    }

    let _reminderShown = false;
    function setupReminderPolling(timeStr) {
      if (window._reminderInterval) return;
      window._reminderInterval = setInterval(() => {
        if (_reminderShown) return;
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        if (hh + ':' + mm === (timeStr || '19:00')) {
          _reminderShown = true;
          setTimeout(() => { _reminderShown = false; }, 60000);
          if (window.confirm('🔔 该学习了！今天有 ' + (3 + Math.floor(Math.random() * 3)) + ' 节课待学习，是否前往？')) {
            navigate('courses');
          }
        }
      }, 60000);
    }

    // ===================== 单元综合测验 =====================
    async function renderUnitTest() {
      if (!state.user) return navigate('login');
      const courseId = state.unitCourseId;
      if (!courseId) return navigate('courses');
      const course = state.currentCourse && state.currentCourse.id === courseId
        ? state.currentCourse
        : await api.get('/api/courses/' + courseId);
      const allLessons = course.lessons;
      const UNITS = [];
      for (let i = 0; i < allLessons.length; i += 3) {
        UNITS.push({ index: UNITS.length, lessons: allLessons.slice(i, i + 3) });
      }
      let unitIdx = state.unitIndex || 0;
      const unit = UNITS[unitIdx];
      if (!unit) return navigate('course', { currentCourse: course });

      // 合并单元内所有 lesson 的 quiz 作为综合题库
      const allQuizzes = [];
      unit.lessons.forEach(l => {
        (l.quiz || []).forEach(q => {
          allQuizzes.push({ ...q, _lessonTitle: l.title });
        });
      });
      const quizSet = allQuizzes.length > 0 ? allQuizzes : buildFallbackQuiz(unit.lessons);

      let answers = new Array(quizSet.length).fill(-1);
      let submitted = false;
      const self = this;

      function buildFallbackQuiz(lessons) {
        const items = [];
        lessons.forEach(l => {
          (l.vocabulary || []).slice(0, 1).forEach(v => {
            const distractors = (l.vocabulary || []).filter(x => x.word !== v.word).slice(0, 3).map(x => x.translation);
            while (distractors.length < 3) distractors.push('其他');
            items.push({ type: 'vocab', question: '【' + l.title + '】 "' + v.word + '" 的中文意思？', options: [v.translation, ...distractors.slice(0, 3)].slice(0, 4), answer: 0 });
          });
        });
        return items;
      }

      function renderQuiz() {
        self.innerHTML = `
          <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm p-8 mt-6">
            <button class="js-uq-back text-sm text-indigo-600 hover:underline mb-3">← 返回课程</button>
            <div class="mb-4">
              <div class="text-xs text-slate-500">${course.title} · 综合测验</div>
              <h1 class="text-2xl font-bold text-slate-900">📋 第 ${unitIdx + 1} 单元测验（共 ${UNITS.length} 单元）</h1>
              <p class="text-sm text-slate-500 mt-1">综合考察本单元 3 个课时的核心知识点</p>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2 mb-6">
              <div class="bg-indigo-600 h-2 rounded-full transition-all" style="width: ${(answers.filter(a=>a>=0).length/quizSet.length)*100}%"></div>
            </div>
            <div class="space-y-5">
              ${quizSet.map((q, qi) => `
                <div class="bg-slate-50 rounded-xl p-4">
                  <div class="text-xs text-indigo-600 mb-1">来自：${q._lessonTitle || ''}</div>
                  <div class="font-medium text-slate-900 mb-3">${qi+1}. ${q.question}</div>
                  <div class="space-y-2">
                    ${q.options.map((o, oi) => `
                      <button data-qi="${qi}" data-oi="${oi}" class="uq-opt w-full p-3 bg-white rounded-lg text-left border-2 ${submitted ? (oi === q.answer ? 'border-green-500 bg-green-50' : (answers[qi] === oi ? 'border-red-500 bg-red-50' : 'border-transparent')) : (answers[qi] === oi ? 'border-indigo-500' : 'border-transparent hover:border-indigo-300')}">${String.fromCharCode(65+oi)}. ${o}</button>
                    `).join('')}
                  </div>
                  ${submitted ? `<div class="text-sm mt-2 ${answers[qi] === q.answer ? 'text-green-600' : 'text-red-600'}">${answers[qi] === q.answer ? '✓ 正确' : '✗ 正确答案：' + q.options[q.answer]}</div>` : ''}
                </div>
              `).join('')}
            </div>
            ${!submitted ? `<button id="uq_submit" class="mt-6 w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl">提交测验</button>` : `
              <div class="mt-6 p-4 rounded-xl ${correctRate() >= 0.6 ? 'bg-green-50 border-2 border-green-300' : 'bg-amber-50 border-2 border-amber-300'}">
                <div class="text-2xl font-bold ${correctRate() >= 0.6 ? 'text-green-700' : 'text-amber-700'} mb-1">得分：${score()} / ${quizSet.length}</div>
                <div class="text-sm ${correctRate() >= 0.6 ? 'text-green-600' : 'text-amber-600'}">${correctRate() >= 0.6 ? '🎉 单元测验通过！' : '⚠️ 建议复习本单元后再试'}</div>
                <div class="mt-3 flex gap-2 flex-wrap">
                  <button id="uq_redo" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm">重新测验</button>
                  ${unitIdx < UNITS.length - 1 ? `<button id="uq_next" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm">下一单元 →</button>` : ''}
                  <button class="js-uq-back px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm">返回课程</button>
                </div>
              </div>
            `}
          </div>
        `;
        if (!submitted) {
          self.querySelectorAll('.uq-opt').forEach(b => {
            b.onclick = () => {
              const qi = parseInt(b.dataset.qi), oi = parseInt(b.dataset.oi);
              answers[qi] = oi;
              renderQuiz();
            };
          });
          $('uq_submit').onclick = submitUnit;
        } else {
          $('uq_redo').onclick = () => { submitted = false; answers = new Array(quizSet.length).fill(-1); renderQuiz(); };
          const nx = $('uq_next');
          if (nx) nx.onclick = () => navigate('unit_test', { unitIndex: unitIdx + 1, unitCourseId: courseId, currentCourse: course });
        }
        self.querySelectorAll('.js-uq-back').forEach(b => b.onclick = () => navigate('course', { currentCourse: course }));
      }

      function score() { return answers.filter((a, i) => a === quizSet[i].answer).length; }
      function correctRate() { return score() / quizSet.length; }
      async function submitUnit() {
        if (answers.some(a => a < 0)) { alert('请先完成所有题目'); return; }
        submitted = true;
        const s = score();
        const weak = [];
        quizSet.forEach((q, i) => {
          if (answers[i] !== q.answer && q._lessonTitle) {
            if (!weak.includes(q._lessonTitle)) weak.push(q._lessonTitle);
          }
        });
        try {
          await api.post('/api/unit-test/submit', {
            course_id: courseId, unit_index: unitIdx, score: s, total: quizSet.length, weak_points: weak
          });
        } catch (e) {}
        renderQuiz();
      }
      renderQuiz();
    }

            class="w-full h-full"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            loading="lazy"
          ></iframe>`;

      const channelLink = isBilibili
        ? `https://space.bilibili.com/${s.channelId}`
        : `https://www.youtube.com/channel/${s.channelId}`;
      const platformName = isBilibili ? 'B站' : 'YouTube';
      const platformColor = isBilibili ? 'bg-pink-500 hover:bg-pink-600' : 'bg-red-600 hover:bg-red-700';
      const followerLabel = isBilibili ? '粉丝' : '订阅';

      const relatedHtml = related.map(r => {
        const thumb = isBilibili
          ? `<div class="w-24 h-14 rounded-lg overflow-hidden bg-gradient-to-br from-pink-400 to-rose-500 flex items-center justify-center flex-shrink-0">
               <div class="text-white text-center">
                 <div class="text-xl">📺</div>
               </div>
             </div>`
          : `<img src="https://img.youtube.com/vi/${r.videoId}/mqdefault.jpg" class="w-24 h-14 object-cover rounded-lg flex-shrink-0" loading="lazy" />`;
        return `<div data-live="${r.id}" data-platform="${platform}" class="js-live-card cursor-pointer flex gap-3 p-2 rounded-lg hover:bg-slate-50">
          ${thumb}
          <div class="flex-1 min-w-0">
            <div class="font-medium text-slate-900 text-xs line-clamp-2">${r.title}</div>
            <div class="text-[10px] text-slate-500 mt-1">${r.teacher} · ${r.duration}</div>
          </div>
        </div>`;
      }).join('');

      this.innerHTML = `
        <div class="mb-4 flex items-center gap-3 flex-wrap">
          <button class="text-sm text-indigo-600 hover:underline" onclick="navigate('live')">← 返回课堂列表</button>
          <span class="text-xs px-2 py-1 ${isBilibili ? 'bg-pink-100 text-pink-700' : 'bg-red-100 text-red-700'} rounded-full font-medium">${platformName} ${isBilibili ? '国内' : '国际'}</span>
        </div>

        <div class="grid lg:grid-cols-3 gap-5">
          <div class="lg:col-span-2">
            <div class="bg-black rounded-2xl overflow-hidden mb-4 relative">
              <div class="aspect-video">
                ${playerHtml}
              </div>
            </div>

            <!-- 课程信息 -->
            <div class="bg-white rounded-2xl p-5 mb-4">
              <div class="flex items-center gap-2 mb-3 flex-wrap">
                <span class="text-xl">${langFlags[s.lang]}</span>
                <span class="text-xs px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded-full">${langNames[s.lang]}</span>
                <span class="text-xs px-2 py-0.5 bg-amber-100 text-amber-700 rounded-full">${levelNames[s.level]}</span>
                <span class="text-xs px-2 py-0.5 ${isBilibili ? 'bg-pink-100 text-pink-700' : 'bg-red-100 text-red-700'} rounded-full">⏱ ${s.duration}</span>
              </div>
              <h1 class="text-xl font-bold text-slate-900 mb-2">${s.title}</h1>
              <div class="flex items-center gap-3 mb-4 flex-wrap">
                <div class="flex items-center gap-2">
                  <div class="w-10 h-10 rounded-full bg-gradient-to-br ${isBilibili ? 'from-pink-400 to-rose-500' : 'from-indigo-400 to-purple-500'} flex items-center justify-center text-white font-bold text-sm">${s.teacher[0]}</div>
                  <div>
                    <div class="font-semibold text-slate-900 text-sm">${s.teacher}</div>
                    <div class="text-xs text-slate-500">${s.students} ${followerLabel} · ${platformName}</div>
                  </div>
                </div>
                <a href="${channelLink}" target="_blank" rel="noopener" class="ml-auto px-3 py-1.5 ${platformColor} text-white text-xs rounded-lg font-medium">访问${isBilibili ? 'UP主主页' : '频道'} →</a>
              </div>
              <h3 class="font-bold text-slate-900 mb-2">📝 课程简介</h3>
              <p class="text-slate-700 text-sm leading-relaxed mb-3">${s.summary}</p>
              <div class="flex gap-1 flex-wrap">
                ${s.tags.map(t => `<span class="text-xs px-2 py-1 bg-slate-100 text-slate-600 rounded-lg">${t}</span>`).join('')}
              </div>
            </div>

            <!-- 学习笔记 -->
            <div class="bg-white rounded-2xl p-5">
              <h3 class="font-bold text-slate-900 mb-3">📝 我的学习笔记</h3>
              <textarea id="live_note" placeholder="在这里记录课堂重点和心得..." class="w-full h-24 px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-400 resize-none"></textarea>
              <button id="live_note_save" class="mt-2 px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm">保存笔记</button>
            </div>
          </div>

          <!-- 侧边栏：讨论区 + 相关推荐 -->
          <div class="space-y-4">
            <div class="bg-white rounded-2xl p-5">
              <h3 class="font-bold text-slate-900 mb-3">💬 课堂讨论</h3>
              <div id="live_chat" class="space-y-2 mb-3 max-h-64 overflow-y-auto">
                <div class="bg-slate-50 rounded-lg p-3 text-sm"><span class="font-semibold text-indigo-700">学员小张：</span><span class="text-slate-600">老师的讲解非常清晰！</span></div>
                <div class="bg-slate-50 rounded-lg p-3 text-sm"><span class="font-semibold text-pink-700">学员Lily：</span><span class="text-slate-600">这个知识点我之前一直搞混，现在终于明白了</span></div>
                <div class="bg-slate-50 rounded-lg p-3 text-sm"><span class="font-semibold text-indigo-700">学员王明：</span><span class="text-slate-600">有没有人能解释一下第5分钟的那个语法点？</span></div>
              </div>
              <div class="flex gap-2">
                <input id="live_msg" placeholder="参与讨论..." class="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-400" />
                <button id="live_send" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm">发送</button>
              </div>
            </div>

            <div class="bg-white rounded-2xl p-5">
              <h3 class="font-bold text-slate-900 mb-3">📚 相关课程推荐</h3>
              <div class="space-y-3">
                ${relatedHtml}
              </div>
            </div>
          </div>
        </div>
      `;

      // 讨论区发送
      $('live_send').onclick = () => {
        const v = $('live_msg').value.trim();
        if (!v) return;
        const div = document.createElement('div');
        div.className = 'bg-indigo-50 rounded-lg p-3 text-sm';
        div.innerHTML = '<span class="font-semibold text-indigo-700">我：</span><span class="text-slate-600">' + v.replace(/</g, '&lt;') + '</span>';
        $('live_chat').appendChild(div);
        $('live_chat').scrollTop = $('live_chat').scrollHeight;
        $('live_msg').value = '';
      };
      $('live_msg').addEventListener('keydown', e => { if (e.key === 'Enter') $('live_send').click(); });

      // 笔记保存
      const noteKey = 'live_note_' + s.id;
      const savedNote = localStorage.getItem(noteKey);
      if (savedNote) $('live_note').value = savedNote;
      $('live_note_save').onclick = () => {
        localStorage.setItem(noteKey, $('live_note').value);
        const btn = $('live_note_save');
        btn.textContent = '✓ 已保存';
        btn.classList.remove('bg-indigo-600');
        btn.classList.add('bg-green-600');
        setTimeout(() => { btn.textContent = '保存笔记'; btn.classList.add('bg-indigo-600'); btn.classList.remove('bg-green-600'); }, 2000);
      };

      // 相关推荐点击
      this.querySelectorAll('.js-live-card').forEach(el => {
        el.onclick = () => navigate('live_room', { liveId: el.dataset.live, livePlatform: el.dataset.platform || platform });
      });
    }

    render();
  </script>
</body>
</html>
