services:
  - type: web
    name: linguaedu
    runtime: static
    repo: https://github.com/lbl1988/linguaedu
    branch: master
    buildCommand: npm install && npm run build
    staticPublishPath: ./public
    numInstances: 1
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), microphone=(), camera=()"

routes:
  # SPA fallback: 任何无法匹配到真实静态文件的路径都回落到 index.html，
  # 由前端路由接管；真实的静态文件（guide.html、plan.html、img 等）优先匹配。
  - type: rewrite
    source: /*
    destination: /index.html
